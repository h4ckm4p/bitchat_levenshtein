<script>
// backend local (voir backend/README.md) — pas les relais Nostr directement : une seule
// connexion partagée, historique persistant, filtrage du bruit déjà fait côté serveur.
const BACKEND = "http://127.0.0.1:8787";
const BACKEND_WS = BACKEND.replace(/^http/, "ws") + "/ws";

// distance de Levenshtein (itérative, sans dépendance)
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = a[i - 1] === b[j - 1]
        ? prev[j - 1]
        : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
    }
    prev = cur;
  }
  return prev[n];
}

// syntaxe de recherche : virgule = OU, "+" = ET (priorité standard, le ET se calcule
// dans chaque groupe avant le OU entre groupes) -- ex: "manif+paris, bastille" matche
// (manif ET paris) OU bastille. Un terme simple sans opérateur se comporte comme avant.
function parseQuery(term) {
  return term.split(",")
    .map((group) => group.split("+").map((s) => s.trim()).filter(Boolean))
    .filter((group) => group.length > 0);
}

// shortcut: distance absolue, pas relative à la longueur du mot — au-delà de 2
// sur un terme court (<6 lettres), le bruit (faux positifs) augmente vite.
function matchesOne(content, term, dist) {
  const text = content.toLowerCase();
  const t = term.toLowerCase();
  if (dist <= 0) return text.includes(t);
  const words = text.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  return words.some((w) => levenshtein(w, t) <= dist);
}

function matches(content, term, dist) {
  return parseQuery(term).some((group) => group.every((t) => matchesOne(content, t, dist)));
}

// retrouve la position exacte du mot qui a fait matcher la colonne (+ sa distance réelle,
// pour la couleur de surbrillance) -- mêmes règles que matches() (sous-chaîne = distance 0,
// mot le plus proche en Levenshtein au-delà). Garde le meilleur candidat, pas le premier
// trouvé, pour refléter la correspondance la plus proche réellement présente.
function findHighlightOne(content, term, dist) {
  const lower = content.toLowerCase();
  const t = term.toLowerCase();
  if (dist <= 0) {
    const idx = lower.indexOf(t);
    return idx === -1 ? null : { start: idx, end: idx + term.length, distance: 0 };
  }
  const re = /[\p{L}\p{N}]+/gu;
  let m, best = null;
  while ((m = re.exec(content))) {
    const d = levenshtein(m[0].toLowerCase(), t);
    if (d <= dist && (!best || d < best.distance)) {
      best = { start: m.index, end: m.index + m[0].length, distance: d };
      if (d === 0) break;
    }
  }
  return best;
}

// surligne un terme du premier groupe ET qui matche intégralement (pas juste "le
// meilleur terme isolé" -- sinon on pourrait surligner un mot d'un groupe ET dont les
// autres termes ne sont pas présents dans ce message).
function findHighlight(content, term, dist) {
  for (const group of parseQuery(term)) {
    if (!group.every((t) => matchesOne(content, t, dist))) continue;
    let best = null;
    for (const t of group) {
      const hl = findHighlightOne(content, t, dist);
      if (hl && (!best || hl.distance < best.distance)) best = hl;
    }
    if (best) return best;
  }
  return null;
}

// couleur de surbrillance par palier de distance : exact (bleu) -> de plus en plus
// "éloigné" (jaune, orange, rouge) pour juger la confiance du match d'un coup d'œil.
const DISTANCE_COLORS = ["#1d9bf0", "#f0b429", "#f0791d", "#f4212e"];
function distanceColor(d) {
  return DISTANCE_COLORS[Math.min(d, DISTANCE_COLORS.length - 1)];
}

function tag(ev, name) {
  return ev.tags.find((x) => x[0] === name)?.[1];
}

// couleur stable par pseudo : hash du nom -> teinte HSL (même pseudo = toujours la même couleur)
function nickColor(nick) {
  let hash = 0;
  for (let i = 0; i < nick.length; i++) hash = (hash * 31 + nick.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(hash) % 360}, 70%, 65%)`;
}

// masquage des liens : jamais un <a> cliquable, juste un texte "lien masqué" révélable au
// clic -- évite qu'une URL de phishing/malveillante s'affiche de façon exploitable dans un
// flux non modéré (même logique que BitWatch, bonne pratique OSINT standard).
const LINK_RE = /(https?:\/\/\S+|www\.\S+)/gi;
function buildMaskedLink(url) {
  const span = document.createElement("span");
  span.className = "masked-link";
  span.textContent = "🔗 lien masqué";
  span.title = "Cliquer pour afficher l'adresse (jamais ouverte automatiquement)";
  let revealed = false;
  span.onclick = (e) => {
    e.stopPropagation();
    revealed = !revealed;
    span.textContent = revealed ? url : "🔗 lien masqué";
  };
  return span;
}

// construit le contenu d'un message : texte normal + liens masqués + surlignage de
// recherche (term/dist optionnels), en fusionnant les deux types de plages de texte
// spéciales pour éviter tout chevauchement (un lien masqué prend le pas sur le surlignage).
function renderMessageContent(container, text, term, dist) {
  const hl = term ? findHighlight(text, term, dist) : null;
  const ranges = [];
  LINK_RE.lastIndex = 0;
  let m;
  while ((m = LINK_RE.exec(text))) {
    ranges.push({ start: m.index, end: m.index + m[0].length, kind: "link", url: m[0] });
  }
  if (hl && !ranges.some((r) => hl.start < r.end && hl.end > r.start)) {
    ranges.push({ ...hl, kind: "hl" });
  }
  ranges.sort((a, b) => a.start - b.start);
  let pos = 0;
  for (const r of ranges) {
    if (r.start > pos) container.append(text.slice(pos, r.start));
    if (r.kind === "link") {
      container.appendChild(buildMaskedLink(r.url));
    } else {
      const mark = document.createElement("span");
      mark.className = "hl";
      mark.style.background = distanceColor(r.distance);
      mark.title = `distance ${r.distance}`;
      mark.textContent = text.slice(r.start, r.end);
      container.appendChild(mark);
    }
    pos = r.end;
  }
  if (pos < text.length) container.append(text.slice(pos));
}

// --- flou volontaire du contenu, persisté comme les autres réglages du dashboard ---
const blurToggle = document.getElementById("blurToggle");
function applyBlurPref() {
  const on = localStorage.getItem("bc_blur_content") === "1";
  document.body.classList.toggle("blur-on", on);
  blurToggle.textContent = on ? "👁️ Afficher" : "🙈 Flouter";
}
blurToggle.onclick = () => {
  const on = document.body.classList.toggle("blur-on");
  localStorage.setItem("bc_blur_content", on ? "1" : "0");
  blurToggle.textContent = on ? "👁️ Afficher" : "🙈 Flouter";
};
applyBlurPref();

// --- messages "gardés" (⭐) : mis de côté pour un dossier précis, exclus de la purge
// automatique côté serveur, avec une note libre -- voir /api/keep, /api/kept, backend/README.md ---
function buildStar(ev) {
  const star = document.createElement("span");
  star.className = "star" + (ev.kept ? " kept" : "");
  star.textContent = ev.kept ? "★" : "☆";
  star.title = ev.kept ? "Retirer des messages gardés" : "Garder ce message (exclu de la purge auto)";
  star.onclick = async (e) => {
    e.stopPropagation();
    const kept = star.classList.contains("kept");
    if (kept) {
      await fetch(`${BACKEND}/api/unkeep`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: ev.id }) });
      star.classList.remove("kept");
      star.textContent = "☆";
      star.title = "Garder ce message (exclu de la purge auto)";
    } else {
      const note = prompt("Note (optionnelle) :", "") || "";
      await fetch(`${BACKEND}/api/keep`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: ev.id, note }) });
      star.classList.add("kept");
      star.textContent = "★";
      star.title = "Retirer des messages gardés";
    }
  };
  return star;
}

async function loadKeptPanel() {
  const list = document.getElementById("keptList");
  list.innerHTML = '<div class="empty">chargement…</div>';
  const kept = await fetch(`${BACKEND}/api/kept`).then((r) => r.json()).catch(() => []);
  list.innerHTML = "";
  if (!kept.length) { list.innerHTML = '<div class="empty">aucun message gardé</div>'; return; }
  kept.forEach((ev) => {
    const nick = tag(ev, "n") || ev.pubkey.slice(0, 8);
    const geohash = tag(ev, "g") || "?";
    const time = new Date((ev.received_at ?? ev.created_at) * 1000).toLocaleString();
    const item = document.createElement("div");
    item.className = "item";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `[${time}] #${geohash} · `;
    const nickSpan = document.createElement("span");
    nickSpan.style.color = nickColor(nick);
    nickSpan.textContent = nick;
    meta.appendChild(nickSpan);
    const content = document.createElement("div");
    content.className = "content";
    content.textContent = ev.content;
    content.style.cursor = "pointer";
    content.title = "Cliquer pour voir tout le canal";
    content.onclick = () => window.open(`channel.html?g=${encodeURIComponent(geohash)}&id=${encodeURIComponent(ev.id)}&ts=${ev.received_at ?? ev.created_at}`, "_blank");
    const note = document.createElement("textarea");
    note.placeholder = "note…";
    note.value = ev.kept_note || "";
    const row = document.createElement("div");
    row.className = "row";
    const saveBtn = document.createElement("button");
    saveBtn.textContent = "Enregistrer la note";
    saveBtn.onclick = () => fetch(`${BACKEND}/api/keep`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: ev.id, note: note.value }) });
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "Retirer";
    removeBtn.onclick = async () => {
      await fetch(`${BACKEND}/api/unkeep`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: ev.id }) });
      loadKeptPanel();
    };
    row.append(saveBtn, removeBtn);
    item.append(meta, content, note, row);
    list.appendChild(item);
  });
}
document.getElementById("keptExportBtn").onclick = (e) => {
  e.preventDefault();
  window.open(`${BACKEND}/api/export/kept`, "_blank");
};
document.getElementById("keptToggle").onclick = () => {
  const panel = document.getElementById("keptPanel");
  panel.classList.toggle("open");
  if (panel.classList.contains("open")) loadKeptPanel();
};
document.getElementById("keptClose").onclick = () => document.getElementById("keptPanel").classList.remove("open");

// --- état des colonnes ---
// shortcut: id stable par colonne (pas l'index dans le tableau) — permet d'ajouter/retirer
// une colonne sans jamais recréer le DOM des autres (ce qui effaçait leurs messages affichés).
let columns = JSON.parse(localStorage.getItem("bc_columns_local") || "[]")
  .map((c) => ({ ...c, id: c.id || crypto.randomUUID() }));
const seenEventIds = new Set();
const recentEvents = []; // petit buffer pour remplir une colonne qu'on vient d'ajouter

function saveColumns() {
  localStorage.setItem("bc_columns_local", JSON.stringify(columns));
}

// glisser-déposer pour réordonner les colonnes (id de la colonne en cours de glissement)
let draggedId = null;

function reorderColumns(draggedId, targetId) {
  const fromIdx = columns.findIndex((c) => c.id === draggedId);
  const toIdx = columns.findIndex((c) => c.id === targetId);
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  const [moved] = columns.splice(fromIdx, 1);
  columns.splice(toIdx, 0, moved);
  saveColumns();
  // déplace juste le nœud DOM concerné (jamais de recréation -> messages/compteurs intacts)
  const root = document.getElementById("columns");
  const draggedEl = root.querySelector(`.col[data-id="${draggedId}"]`);
  const targetEl = root.querySelector(`.col[data-id="${targetId}"]`);
  if (fromIdx < toIdx) targetEl.after(draggedEl);
  else targetEl.before(draggedEl);
}

function createColumnEl(col) {
  const el = document.createElement("div");
  el.className = "col";
  el.dataset.id = col.id;
  el.draggable = true;
  el.innerHTML = `
    <div class="col-head">
      <span class="term" title="${col.term}">${col.term}</span>
      <span class="dist">dist ${col.dist}</span>
      <span class="count" id="count-${col.id}">0</span>
      <span class="close">✕</span>
    </div>
    <div class="col-body" id="body-${col.id}"><div class="empty">en attente de messages…</div></div>
  `;
  el.querySelector(".close").onclick = () => removeColumn(col.id);
  el.addEventListener("dragstart", () => {
    draggedId = col.id;
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => {
    draggedId = null;
    el.classList.remove("dragging");
    document.querySelectorAll(".col.drag-over").forEach((n) => n.classList.remove("drag-over"));
  });
  el.addEventListener("dragover", (e) => {
    e.preventDefault(); // requis pour autoriser le drop
    if (draggedId && draggedId !== col.id) el.classList.add("drag-over");
  });
  el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("drag-over");
    if (draggedId && draggedId !== col.id) reorderColumns(draggedId, col.id);
  });
  return el;
}

// backfill une colonne en cherchant son terme dans TOUT l'historique retenu côté
// serveur (/api/search), pas seulement dans un lot récent générique -- sinon un terme
// peu fréquent (ex: le nom d'une ville précise) se retrouve noyé dès que la base
// grossit, alors même qu'il existe en base (bug observé en conditions réelles).
async function backfillColumn(col) {
  try {
    // shortcut: /api/search renvoie déjà du plus ancien au plus récent (ASC) -- PAS de
    // reverse() ici. Chaque dispatchToColumn fait un prepend ; traiter dans l'ordre ASC
    // garantit que le dernier traité (le plus récent) reste tout en haut. Un reverse()
    // en trop inversait tout l'affichage (bug observé : plus ancien en haut).
    const events = await fetch(
      `${BACKEND}/api/search?term=${encodeURIComponent(col.term)}&dist=${col.dist}&limit=2000`
    ).then((r) => r.json());
    events.forEach((ev) => {
      if (!isBlacklisted(ev.content ?? "")) dispatchToColumn(ev, col);
    });
  } catch (e) {
    console.error(`backfill colonne "${col.term}" impossible:`, e);
  }
}

function renderColumns() {
  // rendu complet, seulement au chargement initial de la page
  const root = document.getElementById("columns");
  root.innerHTML = "";
  columns.forEach((col) => root.appendChild(createColumnEl(col)));
  columns.forEach((col) => backfillColumn(col));
}

async function addColumn(term, dist) {
  if (!term.trim()) return;
  const col = { id: crypto.randomUUID(), term: term.trim(), dist };
  columns.push(col);
  saveColumns();
  document.getElementById("columns").appendChild(createColumnEl(col));
  // les autres colonnes ne sont pas touchées, seule celle-ci se peuple.
  await backfillColumn(col);
}

function removeColumn(id) {
  columns = columns.filter((c) => c.id !== id);
  saveColumns();
  document.querySelector(`.col[data-id="${id}"]`)?.remove();
}

// --- liste noire (spam/trolls/insultes) : un message qui matche est exclu de toutes les colonnes ---
let blacklist = JSON.parse(localStorage.getItem("bc_blacklist_local") || "[]");
let blockedCount = 0;

function saveBlacklist() {
  localStorage.setItem("bc_blacklist_local", JSON.stringify(blacklist));
}

function renderBlacklist() {
  const root = document.getElementById("blChips");
  root.innerHTML = "";
  blacklist.forEach((b, idx) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `${b.term} (dist ${b.dist}) <span class="x" data-idx="${idx}">✕</span>`;
    root.appendChild(chip);
  });
  root.querySelectorAll(".x").forEach((btn) => {
    btn.onclick = () => {
      blacklist.splice(+btn.dataset.idx, 1);
      saveBlacklist();
      renderBlacklist();
    };
  });
}

function addBlacklistTerm(term, dist) {
  if (!term.trim()) return;
  blacklist.push({ term: term.trim(), dist });
  saveBlacklist();
  renderBlacklist();
}

function isBlacklisted(content) {
  return blacklist.some((b) => matches(content, b.term, b.dist));
}

function dispatchToColumn(ev, col) {
  const content = ev.content ?? "";
  if (!matches(content, col.term, col.dist)) return;
  const body = document.getElementById(`body-${col.id}`);
  if (!body) return;
  const empty = body.querySelector(".empty");
  if (empty) empty.remove();
  // received_at (horodatage serveur), pas created_at (déclaré par l'auteur -- non
  // fiable : fuseau horaire ou horloge locale mal réglée côté client bitchat peuvent
  // faire apparaître un message avant des messages en réalité plus anciens).
  const time = new Date((ev.received_at ?? ev.created_at) * 1000).toLocaleTimeString();
  const nick = tag(ev, "n") || ev.pubkey.slice(0, 8);
  const geohash = tag(ev, "g") || "?";

  // shortcut: nick/geohash/lieu viennent du réseau (non fiables) -> construits via
  // textContent, jamais via innerHTML, pour ne pas exécuter du HTML/JS injecté.
  const div = document.createElement("div");
  div.className = "msg";
  div.title = "Cliquer pour voir tout le canal";
  div.onclick = () => window.open(`channel.html?g=${encodeURIComponent(geohash)}&id=${encodeURIComponent(ev.id)}&ts=${ev.received_at ?? ev.created_at}`, "_blank");
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.append(`[${time}] #${geohash} `);
  const nickSpan = document.createElement("span");
  nickSpan.className = "nick";
  nickSpan.style.color = nickColor(nick);
  nickSpan.style.cursor = "pointer";
  nickSpan.title = "Voir tous les messages de cet auteur, tous canaux";
  nickSpan.textContent = nick;
  nickSpan.onclick = (e) => {
    e.stopPropagation(); // ne pas déclencher aussi le clic du message (-> channel.html)
    window.open(`author.html?pubkey=${encodeURIComponent(ev.pubkey)}&nick=${encodeURIComponent(nick)}`, "_blank");
  };
  meta.appendChild(nickSpan);
  meta.appendChild(buildStar(ev));
  if (tag(ev, "t") === "teleport") {
    const tp = document.createElement("span");
    tp.className = "teleport";
    tp.title = "Posté dans ce canal sans y être physiquement (tag bitchat officiel)";
    tp.textContent = " 📡";
    meta.appendChild(tp);
  }
  if (ev.location) {
    const locSpan = document.createElement("span");
    locSpan.className = "loc";
    locSpan.textContent = ` · ${ev.location}`;
    meta.appendChild(locSpan);
  }
  const contentDiv = document.createElement("div");
  contentDiv.className = "content";
  // garde-fou d'affichage même si un message long passe entre les mailles du filtre
  const shown = content.length > 1500 ? content.slice(0, 1500) + "…" : content;
  renderMessageContent(contentDiv, shown, col.term, col.dist);
  div.append(meta, contentDiv);
  body.prepend(div);
  const countEl = document.getElementById(`count-${col.id}`);
  countEl.textContent = +countEl.textContent + 1;
}

function dispatchEvent(ev) {
  const content = ev.content ?? "";
  if (isBlacklisted(content)) {
    blockedCount++;
    document.getElementById("blockedCount").textContent = `${blockedCount} messages bloqués`;
    return;
  }
  columns.forEach((col) => dispatchToColumn(ev, col));
}

function ingest(ev) {
  if (seenEventIds.has(ev.id)) return;
  seenEventIds.add(ev.id);
  recentEvents.push(ev);
  if (recentEvents.length > 300) recentEvents.shift();
  dispatchEvent(ev);
}

// --- backfill (historique persistant côté backend) puis flux live ---
let lastMessageAt = null;
function updateFreshness() {
  const el = document.getElementById("freshness");
  el.textContent = lastMessageAt
    ? `dernier message il y a ${Math.round((Date.now() - lastMessageAt) / 1000)}s`
    : "aucun message reçu";
}
setInterval(updateFreshness, 1000);

function updateNodeCount() {
  fetch(`${BACKEND}/api/status`)
    .then((r) => r.json())
    .then(({ relaysConnected, relaysTotal }) => {
      document.getElementById("nodeCount").textContent = `${relaysConnected}/${relaysTotal} nœuds connectés`;
    })
    .catch(() => {});
}
updateNodeCount();
setInterval(updateNodeCount, 5000);

function updateStoredCount() {
  fetch(`${BACKEND}/api/stats`)
    .then((r) => r.json())
    .then(({ totalMessages, totalNoise, retentionDays }) => {
      document.getElementById("storedCount").textContent =
        `${totalMessages} messages stockés (+${totalNoise} bruit) — purge auto après ${retentionDays}j`;
    })
    .catch(() => {});
}
updateStoredCount();
setInterval(updateStoredCount, 10000);

// lit jusqu'à 3 champs de terme + un sélecteur ET/OU, construit la query texte
// ("a+b" ou "a,b") que matches()/parseQuery() comprennent déjà -- évite d'exposer la
// syntaxe brute à l'utilisateur tout en gardant le même moteur de correspondance.
function buildQuery(ids, opId) {
  const op = document.getElementById(opId).value;
  const terms = ids.map((id) => document.getElementById(id).value.trim()).filter(Boolean);
  return terms.join(op);
}
function clearQueryInputs(ids) {
  ids.forEach((id) => { document.getElementById(id).value = ""; });
}

document.getElementById("exportBtn").onclick = () => {
  const term = buildQuery(["exp1", "exp2", "exp3"], "expOp");
  if (!term) return;
  const dist = +document.getElementById("exportDist").value || 0;
  const format = document.getElementById("exportFormat").value;
  window.open(`${BACKEND}/api/export?term=${encodeURIComponent(term)}&dist=${dist}&format=${format}`, "_blank");
};

// export/import de TOUTE la base (fichier .db), pour partager l'historique collecté avec
// quelqu'un d'autre -- distinct de "Exporter la recherche" ci-dessus qui ne prend que les
// résultats filtrés. La config (colonnes/liste noire) n'est volontairement pas incluse,
// elle vit dans localStorage : chaque personne garde ses propres règles de recherche.
document.getElementById("dbExportBtn").onclick = () => {
  window.open(`${BACKEND}/api/db/export`, "_blank");
};
document.getElementById("dbImportBtn").onclick = () => {
  document.getElementById("dbImportFile").click();
};
document.getElementById("dbImportFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("dbStatus");
  status.textContent = `import de "${file.name}" en cours…`;
  try {
    const res = await fetch(`${BACKEND}/api/db/import`, { method: "POST", body: file });
    if (!res.ok) throw new Error(await res.text());
    const { added } = await res.json();
    status.textContent = `${added} nouveaux messages importés (doublons ignorés)`;
    updateStoredCount();
  } catch (err) {
    status.textContent = `échec de l'import : ${err.message}`;
  } finally {
    e.target.value = ""; // permet de réimporter le même fichier si besoin
  }
});

fetch(`${BACKEND}/api/messages?limit=500`)
  .then((r) => r.json())
  .then((events) => {
    events.slice().reverse().forEach(ingest); // du plus ancien au plus récent
    if (events.length) lastMessageAt = Date.now();
  })
  .catch((e) => {
    document.getElementById("status").textContent = "backend local injoignable (voir backend/README.md)";
    console.error(e);
  });

let backendAttempts = 0;
const RECONNECT_DELAYS = [500, 1000, 2000, 5000, 15000, 60000];
function connectBackend() {
  const ws = new WebSocket(BACKEND_WS);
  let stableTimer = null;
  ws.onopen = () => {
    document.getElementById("status").textContent = "connecté au backend local";
    stableTimer = setTimeout(() => { backendAttempts = 0; }, 60000);
  };
  ws.onmessage = (e) => {
    lastMessageAt = Date.now();
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    ingest(ev);
  };
  ws.onerror = () => {};
  ws.onclose = () => {
    clearTimeout(stableTimer);
    document.getElementById("status").textContent = "backend local déconnecté, reconnexion…";
    const delay = RECONNECT_DELAYS[Math.min(backendAttempts, RECONNECT_DELAYS.length - 1)];
    backendAttempts++;
    setTimeout(connectBackend, delay * (0.75 + Math.random() * 0.5));
  };
}
connectBackend();

document.getElementById("addBtn").onclick = () => {
  const term = buildQuery(["term1", "term2", "term3"], "termOp");
  const dist = +document.getElementById("distInput").value || 0;
  addColumn(term, dist);
  clearQueryInputs(["term1", "term2", "term3"]);
};
["term1", "term2", "term3"].forEach((id) => {
  document.getElementById(id).addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("addBtn").click();
  });
});

document.getElementById("blAddBtn").onclick = () => {
  const term = buildQuery(["bl1", "bl2", "bl3"], "blOp");
  const dist = +document.getElementById("blDistInput").value || 0;
  addBlacklistTerm(term, dist);
  clearQueryInputs(["bl1", "bl2", "bl3"]);
};
["bl1", "bl2", "bl3"].forEach((id) => {
  document.getElementById(id).addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("blAddBtn").click();
  });
});

renderColumns();
renderBlacklist();
</script>
