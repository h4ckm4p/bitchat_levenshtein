<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>bitchat — dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #15181c; color: #e7e9ea; font: 14px/1.4 -apple-system, "Segoe UI", sans-serif;
  }
  #toolbar {
    display: flex; gap: 8px; align-items: center; padding: 10px 14px;
    background: #1c1f23; border-bottom: 1px solid #2a2e33; flex-shrink: 0;
  }
  #toolbar input[type=text] {
    background: #0f1113; border: 1px solid #2a2e33; color: #e7e9ea;
    padding: 6px 10px; border-radius: 6px; width: 180px;
  }
  #toolbar input[type=number] {
    background: #0f1113; border: 1px solid #2a2e33; color: #e7e9ea;
    padding: 6px 6px; border-radius: 6px; width: 56px;
  }
  #toolbar button {
    background: #1d9bf0; border: none; color: white; padding: 7px 14px;
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  #toolbar label { color: #8b98a5; font-size: 12px; }
  #status { margin-left: auto; color: #8b98a5; font-size: 12px; }
  #blacklistBar {
    display: flex; gap: 8px; align-items: center; padding: 8px 14px;
    background: #1c1315; border-bottom: 1px solid #2a2e33; flex-shrink: 0; flex-wrap: wrap;
  }
  #blacklistBar input[type=text] {
    background: #0f1113; border: 1px solid #3a2a2c; color: #e7e9ea;
    padding: 6px 10px; border-radius: 6px; width: 180px;
  }
  #blacklistBar input[type=number] {
    background: #0f1113; border: 1px solid #3a2a2c; color: #e7e9ea;
    padding: 6px 6px; border-radius: 6px; width: 56px;
  }
  #blacklistBar button {
    background: #f4212e; border: none; color: white; padding: 7px 14px;
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  #blacklistBar label { color: #8b98a5; font-size: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; background: #2a1a1c;
    border: 1px solid #3a2a2c; border-radius: 999px; padding: 4px 10px; font-size: 12px;
  }
  .chip .x { cursor: pointer; color: #8b98a5; }
  .chip .x:hover { color: #f4212e; }
  #blockedCount { color: #8b98a5; font-size: 12px; margin-left: auto; }
  #columns { flex: 1; display: flex; overflow-x: auto; }
  .col {
    width: 320px; flex-shrink: 0; border-right: 1px solid #2a2e33;
    display: flex; flex-direction: column; min-width: 0;
  }
  .col-head {
    padding: 10px 12px; background: #1c1f23; border-bottom: 1px solid #2a2e33;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0; cursor: grab;
  }
  .col.dragging { opacity: 0.4; }
  .col.drag-over { box-shadow: inset 2px 0 0 #1d9bf0; }
  .col-head .term { font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-head .dist { color: #8b98a5; font-size: 11px; }
  .col-head .count { color: #8b98a5; font-size: 11px; min-width: 2em; text-align: right; }
  .col-head .close { cursor: pointer; color: #8b98a5; padding: 0 2px; }
  .col-head .close:hover { color: #f4212e; }
  .col-body { flex: 1; overflow-y: auto; padding: 6px; }
  .msg { padding: 8px; margin-bottom: 6px; background: #1c1f23; border-radius: 8px; border: 1px solid #23262b; }
  .msg .meta { color: #8b98a5; font-size: 11px; margin-bottom: 3px; }
  .msg .meta .nick { color: #1d9bf0; }
  .msg .content .hl { background: #1d9bf0; color: #0b0e11; border-radius: 3px; padding: 0 2px; font-weight: 700; }
  .msg .content { word-break: break-word; white-space: pre-wrap; }
  .empty { color: #5b6672; padding: 20px; text-align: center; font-size: 12px; }
</style>
</head>
<body>
  <div id="toolbar">
    <input type="text" id="termInput" placeholder="terme à surveiller…" />
    <label>distance <input type="number" id="distInput" min="0" max="4" value="0" /></label>
    <button id="addBtn">+ Colonne</button>
    <div id="freshness" style="color:#8b98a5;font-size:12px;">aucun message reçu</div>
    <div id="status">connexion…</div>
  </div>
  <div id="blacklistBar">
    <input type="text" id="blTermInput" placeholder="terme à bloquer (spam, troll…)" />
    <label>distance <input type="number" id="blDistInput" min="0" max="4" value="0" /></label>
    <button id="blAddBtn">+ Liste noire</button>
    <div id="blChips"></div>
    <div id="noiseCount" style="color:#8b98a5;font-size:12px;">0 bruit filtré</div>
    <div id="blockedCount">0 messages bloqués</div>
  </div>
  <div id="columns"></div>

<script>
const RELAYS = [
  "wss://relay.damus.io",
  "wss://nos.lol",
  "wss://relay.primal.net",
  "wss://offchain.pub",
];

// distance de Levenshtein (itérative, sans dépendance)
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = a[i - 1] === b[j - 1]
        ? prev[j - 1]
        : 1 + Math.min(prev[j - 1], prev[j], cur[j - 1]);
    }
    prev = cur;
  }
  return prev[n];
}

// shortcut: distance absolue, pas relative à la longueur du mot — au-delà de 2
// sur un terme court (<6 lettres), le bruit (faux positifs) augmente vite.
function matches(content, term, dist) {
  const text = content.toLowerCase();
  const t = term.toLowerCase();
  if (dist <= 0) return text.includes(t);
  const words = text.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  return words.some((w) => levenshtein(w, t) <= dist);
}

// retrouve la position exacte du mot qui a fait matcher la colonne, pour le surligner
// dans le message affiché -- mêmes règles que matches() (sous-chaîne à distance 0,
// mot le plus proche en Levenshtein au-delà).
function findHighlight(content, term, dist) {
  const lower = content.toLowerCase();
  const t = term.toLowerCase();
  if (dist <= 0) {
    const idx = lower.indexOf(t);
    return idx === -1 ? null : { start: idx, end: idx + term.length };
  }
  const re = /[\p{L}\p{N}]+/gu;
  let m;
  while ((m = re.exec(content))) {
    if (levenshtein(m[0].toLowerCase(), t) <= dist) {
      return { start: m.index, end: m.index + m[0].length };
    }
  }
  return null;
}

function tag(ev, name) {
  return ev.tags.find((x) => x[0] === name)?.[1];
}

// un message de chat humain n'est quasiment jamais du JSON valide (bruit protocole
// d'autres apps : nearby-presence, handshake, chunks d'image...), ni un pavé de 3000+
// caracteres, ni majoritairement des diacritiques Unicode combinants (spam "zalgo" vu
// en direct : un message de 300 Ko qui casse l'affichage).
const MAX_LEN = 3000;
const COMBINING_RE = /[\u0300-\u036f\u1ab0-\u1aff\u1dc0-\u1dff\u20d0-\u20ff\ufe20-\ufe2f]/g;
function isNoise(content) {
  const text = content.trim();
  if (text.length > MAX_LEN) return true;
  if (text.startsWith("{") || text.startsWith("[")) {
    try { JSON.parse(text); return true; } catch { /* pas du JSON, continue */ }
  }
  const combining = (text.match(COMBINING_RE) || []).length;
  return text.length > 0 && combining / text.length > 0.3;
}

// --- état des colonnes ---
// shortcut: id stable par colonne (pas l'index dans le tableau) — permet d'ajouter/retirer
// une colonne sans jamais recréer le DOM des autres (ce qui effaçait leurs messages affichés).
let columns = JSON.parse(localStorage.getItem("bc_columns") || "[]")
  .map((c) => ({ ...c, id: c.id || crypto.randomUUID() }));
const seenEventIds = new Set();
const recentEvents = []; // petit buffer pour remplir une colonne qu'on vient d'ajouter

function saveColumns() {
  localStorage.setItem("bc_columns", JSON.stringify(columns));
}

// couleur stable par pseudo : hash du nom -> teinte HSL (même pseudo = toujours la même couleur)
function nickColor(nick) {
  let hash = 0;
  for (let i = 0; i < nick.length; i++) hash = (hash * 31 + nick.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(hash) % 360}, 70%, 65%)`;
}

// glisser-déposer pour réordonner les colonnes (id de la colonne en cours de glissement)
let draggedId = null;

function reorderColumns(draggedId, targetId) {
  const fromIdx = columns.findIndex((c) => c.id === draggedId);
  const toIdx = columns.findIndex((c) => c.id === targetId);
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  const [moved] = columns.splice(fromIdx, 1);
  columns.splice(toIdx, 0, moved);
  saveColumns();
  // déplace juste le nœud DOM concerné (jamais de recréation -> messages/compteurs intacts)
  const root = document.getElementById("columns");
  const draggedEl = root.querySelector(`.col[data-id="${draggedId}"]`);
  const targetEl = root.querySelector(`.col[data-id="${targetId}"]`);
  if (fromIdx < toIdx) targetEl.after(draggedEl);
  else targetEl.before(draggedEl);
}

function createColumnEl(col) {
  const el = document.createElement("div");
  el.className = "col";
  el.dataset.id = col.id;
  el.draggable = true;
  el.innerHTML = `
    <div class="col-head">
      <span class="term">${col.term}</span>
      <span class="dist">dist ${col.dist}</span>
      <span class="count" id="count-${col.id}">0</span>
      <span class="close">✕</span>
    </div>
    <div class="col-body" id="body-${col.id}"><div class="empty">en attente de messages…</div></div>
  `;
  el.querySelector(".close").onclick = () => removeColumn(col.id);
  el.addEventListener("dragstart", () => {
    draggedId = col.id;
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => {
    draggedId = null;
    el.classList.remove("dragging");
    document.querySelectorAll(".col.drag-over").forEach((n) => n.classList.remove("drag-over"));
  });
  el.addEventListener("dragover", (e) => {
    e.preventDefault(); // requis pour autoriser le drop
    if (draggedId && draggedId !== col.id) el.classList.add("drag-over");
  });
  el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("drag-over");
    if (draggedId && draggedId !== col.id) reorderColumns(draggedId, col.id);
  });
  return el;
}

function renderColumns() {
  // rendu complet, seulement au chargement initial de la page
  const root = document.getElementById("columns");
  root.innerHTML = "";
  columns.forEach((col) => root.appendChild(createColumnEl(col)));
  recentEvents.forEach((ev) => dispatchEvent(ev));
}

function addColumn(term, dist) {
  if (!term.trim()) return;
  const col = { id: crypto.randomUUID(), term: term.trim(), dist };
  columns.push(col);
  saveColumns();
  document.getElementById("columns").appendChild(createColumnEl(col));
  // ne peuple que la nouvelle colonne depuis le buffer récent — les autres ne sont pas touchées
  recentEvents.forEach((ev) => { if (!isBlacklisted(ev.content ?? "")) dispatchToColumn(ev, col); });
}

function removeColumn(id) {
  columns = columns.filter((c) => c.id !== id);
  saveColumns();
  document.querySelector(`.col[data-id="${id}"]`)?.remove();
}

// --- liste noire (spam/trolls/insultes) : un message qui matche est exclu de toutes les colonnes ---
let blacklist = JSON.parse(localStorage.getItem("bc_blacklist") || "[]");
let blockedCount = 0;
let noiseCount = 0;

function saveBlacklist() {
  localStorage.setItem("bc_blacklist", JSON.stringify(blacklist));
}

function renderBlacklist() {
  const root = document.getElementById("blChips");
  root.innerHTML = "";
  blacklist.forEach((b, idx) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `${b.term} (dist ${b.dist}) <span class="x" data-idx="${idx}">✕</span>`;
    root.appendChild(chip);
  });
  root.querySelectorAll(".x").forEach((btn) => {
    btn.onclick = () => {
      blacklist.splice(+btn.dataset.idx, 1);
      saveBlacklist();
      renderBlacklist();
    };
  });
}

function addBlacklistTerm(term, dist) {
  if (!term.trim()) return;
  blacklist.push({ term: term.trim(), dist });
  saveBlacklist();
  renderBlacklist();
}

function isBlacklisted(content) {
  return blacklist.some((b) => matches(content, b.term, b.dist));
}

function dispatchToColumn(ev, col) {
  const content = ev.content ?? "";
  if (!matches(content, col.term, col.dist)) return;
  const body = document.getElementById(`body-${col.id}`);
  if (!body) return;
  const empty = body.querySelector(".empty");
  if (empty) empty.remove();
  const time = new Date(ev.created_at * 1000).toLocaleTimeString();
  const nick = tag(ev, "n") || ev.pubkey.slice(0, 8);
  const geohash = tag(ev, "g") || "?";

  // shortcut: nick/geohash viennent du réseau (non fiables) -> construits via textContent,
  // jamais via innerHTML, pour ne pas exécuter du HTML/JS injecté dans un pseudo.
  const div = document.createElement("div");
  div.className = "msg";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.append(`[${time}] #${geohash} `);
  const nickSpan = document.createElement("span");
  nickSpan.className = "nick";
  nickSpan.style.color = nickColor(nick);
  nickSpan.textContent = nick;
  meta.appendChild(nickSpan);
  const contentDiv = document.createElement("div");
  contentDiv.className = "content";
  // garde-fou d'affichage même si un message long passe entre les mailles du filtre
  const shown = content.length > 1500 ? content.slice(0, 1500) + "…" : content;
  const hl = findHighlight(shown, col.term, col.dist);
  if (hl) {
    contentDiv.append(shown.slice(0, hl.start));
    const mark = document.createElement("span");
    mark.className = "hl";
    mark.textContent = shown.slice(hl.start, hl.end);
    contentDiv.appendChild(mark);
    contentDiv.append(shown.slice(hl.end));
  } else {
    contentDiv.textContent = shown;
  }
  div.append(meta, contentDiv);
  body.prepend(div);
  const countEl = document.getElementById(`count-${col.id}`);
  countEl.textContent = +countEl.textContent + 1;
}

function dispatchEvent(ev) {
  const content = ev.content ?? "";
  if (isBlacklisted(content)) return;
  columns.forEach((col) => dispatchToColumn(ev, col));
}

// --- connexion aux relais, avec reconnexion à backoff (un relais mort ne doit pas être martelé) ---
const relayState = {}; // url -> { ws, open, stableTimer }
const relayAttempts = {}; // url -> nb d'échecs consécutifs
const RECONNECT_DELAYS = [500, 1000, 2000, 5000, 15000, 60000, 300000]; // ms
const STABLE_AFTER_MS = 60000; // connexion restée ouverte ce temps -> on réinitialise le backoff
let lastMessageAt = null;

function updateStatus() {
  const openCount = Object.values(relayState).filter((r) => r.open).length;
  document.getElementById("status").textContent = `${openCount}/${RELAYS.length} relais connectés`;
}

function updateFreshness() {
  const el = document.getElementById("freshness");
  el.textContent = lastMessageAt
    ? `dernier message il y a ${Math.round((Date.now() - lastMessageAt) / 1000)}s`
    : "aucun message reçu";
}
setInterval(updateFreshness, 1000);

function scheduleReconnect(url) {
  const attempt = relayAttempts[url] || 0;
  const base = RECONNECT_DELAYS[Math.min(attempt, RECONNECT_DELAYS.length - 1)];
  const delay = base * (0.75 + Math.random() * 0.5); // jitter ±25%
  setTimeout(() => connectRelay(url), delay);
}

function connectRelay(url) {
  const ws = new WebSocket(url);
  relayState[url] = { ws, open: false, stableTimer: null };
  ws.onopen = () => {
    relayState[url].open = true;
    updateStatus();
    ws.send(JSON.stringify(["REQ", "dash", { kinds: [20000] }]));
    // reconnexion stable un moment -> on repart sur le délai le plus court la prochaine fois
    relayState[url].stableTimer = setTimeout(() => { relayAttempts[url] = 0; }, STABLE_AFTER_MS);
  };
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg[0] !== "EVENT") return;
    const ev = msg[2];
    lastMessageAt = Date.now();
    if (seenEventIds.has(ev.id)) return;
    seenEventIds.add(ev.id);
    if (isNoise(ev.content ?? "")) {
      noiseCount++;
      document.getElementById("noiseCount").textContent = `${noiseCount} bruit filtré`;
      return;
    }
    recentEvents.push(ev);
    if (recentEvents.length > 300) recentEvents.shift();
    if (isBlacklisted(ev.content ?? "")) {
      blockedCount++;
      document.getElementById("blockedCount").textContent = `${blockedCount} messages bloqués`;
      return;
    }
    dispatchEvent(ev);
  };
  // shortcut: toute la logique de reconnexion vit dans onclose — un échec de connexion
  // déclenche toujours onerror PUIS onclose dans les navigateurs, donc gérer les deux
  // doublerait le compteur d'essais et programmerait deux reconnexions en parallèle.
  ws.onerror = () => {};
  ws.onclose = () => {
    const state = relayState[url];
    if (!state) return;
    clearTimeout(state.stableTimer);
    state.open = false;
    updateStatus();
    relayAttempts[url] = (relayAttempts[url] || 0) + 1;
    scheduleReconnect(url);
  };
}

RELAYS.forEach(connectRelay);

document.getElementById("addBtn").onclick = () => {
  const term = document.getElementById("termInput").value;
  const dist = +document.getElementById("distInput").value || 0;
  addColumn(term, dist);
  document.getElementById("termInput").value = "";
};
document.getElementById("termInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("addBtn").click();
});

document.getElementById("blAddBtn").onclick = () => {
  const term = document.getElementById("blTermInput").value;
  const dist = +document.getElementById("blDistInput").value || 0;
  addBlacklistTerm(term, dist);
  document.getElementById("blTermInput").value = "";
};
document.getElementById("blTermInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("blAddBtn").click();
});

renderColumns();
renderBlacklist();
</script>
</body>
</html>
